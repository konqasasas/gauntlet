name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: VPS に反映するもの（plugin はサーバーを再起動、display / menu は再起動なしで読み直す）
        type: choice
        options: [plugin, web, both, display, menu, none]
        default: plugin

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: parkour-gauntlet
          path: build/libs/parkour-gauntlet-0.1.0.jar
          if-no-files-found: error
          retention-days: 14

  dialog-editor:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dialog-editor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dialog-editor/package-lock.json
      - run: npm ci
      # The tests need the game font data (Minecraft assets, never committed). It comes from
      # Mojang's official downloads, checked by SHA-1, and is cached between runs.
      - id: vanilla
        uses: actions/cache@v6
        with:
          path: dialog-editor/data/vanilla
          key: dialog-vanilla-26.3-${{ hashFiles('dialog-editor/tools/fetch-vanilla.mjs') }}
      - if: steps.vanilla.outputs.cache-hit != 'true'
        run: node tools/fetch-vanilla.mjs --download-jar
      - run: npm test

  deploy:
    # Only from the "Run workflow" button, and only one deploy at a time.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy != 'none'
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: vps-deploy
      cancel-in-progress: false
    env:
      VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: parkour-gauntlet
          path: dist
      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          # Secrets pasted from Windows may carry CRLF line endings, which ssh cannot read.
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || { echo 'VPS_SSH_KEY is not a valid private key (paste the whole file, BEGIN to END).' >&2; exit 1; }
      - name: Deploy plugin
        if: inputs.deploy == 'plugin' || inputs.deploy == 'both'
        run: ssh -o BatchMode=yes "$VPS" deploy-plugin < dist/parkour-gauntlet-0.1.0.jar
      - name: Deploy web
        if: inputs.deploy == 'web' || inputs.deploy == 'both'
        run: tar -C web -cf - . | ssh -o BatchMode=yes "$VPS" deploy-web
      - name: Deploy display settings
        if: inputs.deploy == 'display'
        run: |
          cd config
          files=$(ls display.yml lang/ja.yml lang/en.yml 2>/dev/null || true)
          if [ -z "$files" ]; then echo "config/ has no display.yml or lang/*.yml" >&2; exit 1; fi
          tar -cf - $files | ssh -o BatchMode=yes "$VPS" deploy-display
      - name: Deploy menu
        # Restores the menu from git (config/menu). Usually the VPS editor publishes instead (deploy.ps1 -Menu -FromEditor).
        if: inputs.deploy == 'menu'
        run: |
          cd config/menu
          files=$(ls -d templates datapack.zip resourcepack.zip manifest.json 2>/dev/null || true)
          tar -cf - $files | ssh -o BatchMode=yes "$VPS" deploy-menu
