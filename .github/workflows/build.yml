name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: VPS に反映するもの（plugin はサーバーを再起動、display は再起動なしで表示設定を読み直す）
        type: choice
        options: [plugin, web, both, display, none]
        default: plugin

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: parkour-gauntlet
          path: build/libs/parkour-gauntlet-0.1.0.jar
          if-no-files-found: error
          retention-days: 14

  deploy:
    # Only from the "Run workflow" button, and only one deploy at a time.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy != 'none'
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: vps-deploy
      cancel-in-progress: false
    env:
      VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: parkour-gauntlet
          path: dist
      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy plugin
        if: inputs.deploy == 'plugin' || inputs.deploy == 'both'
        run: ssh -o BatchMode=yes "$VPS" deploy-plugin < dist/parkour-gauntlet-0.1.0.jar
      - name: Deploy web
        if: inputs.deploy == 'web' || inputs.deploy == 'both'
        run: tar -C web -cf - . | ssh -o BatchMode=yes "$VPS" deploy-web
      - name: Deploy display settings
        if: inputs.deploy == 'display'
        run: |
          cd config
          files=$(ls display.yml lang/ja.yml lang/en.yml 2>/dev/null || true)
          if [ -z "$files" ]; then echo "config/ has no display.yml or lang/*.yml" >&2; exit 1; fi
          tar -cf - $files | ssh -o BatchMode=yes "$VPS" deploy-display
