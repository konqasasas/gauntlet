# The Dialog editor at https://catenaonline.net/dialog/ (installed by dialog-setup.sh into /etc/nginx/snippets/).
# Password protected; the editor itself listens on 127.0.0.1:4320 only.
location = /dialog { return 301 /dialog/; }
location /dialog/ {
    auth_basic "Catena Online Dialog editor";
    auth_basic_user_file /etc/nginx/gauntlet-dialog.htpasswd;
    proxy_pass http://127.0.0.1:4320/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # /api/events is a server-sent event stream.
    proxy_buffering off;
    proxy_read_timeout 1h;
    # Image uploads.
    client_max_body_size 25m;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
