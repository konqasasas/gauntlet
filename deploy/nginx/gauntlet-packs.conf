# Resource packs at https://catenaonline.net/packs/<sha1>.zip (installed by web-setup.sh into /etc/nginx/snippets/).
# The plugin publishes them into /var/lib/gauntlet-packs; a name never changes content, so clients may cache it forever.
location /packs/ {
    alias /var/lib/gauntlet-packs/;
    autoindex off;
    default_type application/zip;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    location ~ /\. { deny all; }
}
