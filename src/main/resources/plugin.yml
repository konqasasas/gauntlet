name: ParkourGauntlet
version: '${version}'
main: konqasasas.gauntlet.ParkourGauntletPlugin
api-version: '26.3'
author: konqasasas
description: Parkour Gauntlet course creation tools.
# Emotes in the menu play BetterModel animations when it is installed.
softdepend: [BetterModel]
# Paper downloads these from Maven Central at startup (not shaded into the JAR).
libraries:
  - org.xerial:sqlite-jdbc:3.51.3.0
commands:
  gauntlet:
    description: Receive course creation tools
    usage: /gauntlet kit|trigger|reload lang|reload menu|reload display|reload packs
    permission: gauntlet.admin
  course:
    description: Open the course GUI
    usage: /course [play <id>|practice <id>|leave|undosave]
  translate:
    description: Chat translation settings
    usage: /translate [on|off|lang <code>]
  lang:
    description: Interface language
    usage: /lang [ja|en|auto]
  menu:
    description: Open the menu (Dialog)
    usage: /menu
  settings:
    description: Personal settings
    usage: /settings [<key> <value>]
  module:
    description: Modules for generated courses (builders)
    usage: /module [generate <profile> [seed] | play <profile> | practice <profile> | remove <profile> | settings | place | set <key> <value> | profile <name> <modules> <from> <to>]
    permission: gauntlet.admin
  ranking:
    description: Rankings
    usage: /ranking <course> | /ranking rank <n>
  replay:
    description: Watch recorded runs (builders)
    usage: /replay list [player] | play <id> | pause | back | forward | speed | stop
    permission: gauntlet.admin
  cosmetic:
    description: Cosmetics for builders (testing)
    usage: /cosmetic catalog|list|grant|revoke|equip|purchases|reload
    permission: gauntlet.admin
permissions:
  gauntlet.admin:
    description: Use course creation tools
    default: op
  gauntlet.display.admin:
    description: Show the [ADMIN] tag next to the name
    default: op
