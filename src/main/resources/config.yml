# Parkour Gauntlet 設定（変更後はサーバーを再起動）

# サーバーの表示
server:
  # TABのロゴ・スコアボードのタイトル
  name: "Catena Online"
  # スコアボードの最下行
  address: "mc.catenaonline.net"

# TAB
tab:
  # Pingの色分け（ミリ秒）。good未満は緑、ok未満は黄、それ以上は赤
  ping-good: 100
  ping-ok: 200
  # ヒントの切り替え間隔（秒）。文言は lang/*.yml の tab.hints
  hint-seconds: 20

# メニュー（Dialog エディターの雛形。plugins/ParkourGauntlet/menu/）
menu:
  # 役割ごとの画面。空なら、台帳風のメニュー（home / settings）があればそれ、なければ以前のメニュー（top_menu / settings）
  screens:
    # /menu で開く画面
    home: ""
    # 設定を変えたあと、戻り先の指定がないときに開く画面
    settings: ""

# リソースパック（メニューの画像・フォントと、エモート用の BetterModel のパック）
resource-packs:
  # 参加時に送る。publish-dir がないサーバー（手元の試験用など）では何もしない
  enabled: true
  # 配る URL の先頭。publish-dir の中身を Web サーバーがこの URL で出す（VPS では nginx の /packs/）
  base-url: "https://catenaonline.net/packs/"
  # パックを「SHA-1.zip」の名前で置くフォルダ
  publish-dir: "/var/lib/gauntlet-packs"
  # true にすると、受け取らなかった人は参加できない
  required: false
  # 送るパック（サーバーのフォルダからの相対パス）。別々のパックとして送る
  files:
    - "plugins/BetterModel/build.zip"
    - "plugins/ParkourGauntlet/menu/resourcepack.zip"
  # メニュー用のパック。これを読み込み終えるまでメニューは開かない
  menu-file: "plugins/ParkourGauntlet/menu/resourcepack.zip"
  # ファイルの変化を調べる間隔（秒）。変わったら参加中の人にも送り直す
  check-seconds: 10

# ロビー
lobby:
  # ロビーとして扱うワールド名。空なら無効。
  # 有効にすると、このワールドにいるAdventure/Survivalのプレイヤーは所持品が
  # ロビー用のホットバー（1番：ブロック、8番：プレイヤー表示）に置き換わる
  world: ""
  # ロビーで置いたブロックが消えるまでの秒数
  block-seconds: 10

# チャット翻訳
translation:
  # 翻訳エンジン: mymemory / libretranslate / none
  engine: mymemory
  # 1回の翻訳を待つ最大時間（ミリ秒）。超えたら原文と[翻訳]ボタンで表示する
  timeout-ms: 2500
  mymemory:
    # 連絡用メールアドレス。書くと無料枠が1日5,000文字から50,000文字に増える
    email: ""
  libretranslate:
    # 自前で立てたLibreTranslateサーバーのURL
    url: "http://localhost:5000"
    # サーバー側でAPIキーを有効にした場合のみ
    api-key: ""

# ゴースト（同じコースのほかのレーンにいる人を、自分のレーンにマネキンとして出す）
ghosts:
  # この距離（ブロック）より近い人だけ出す
  near: 64
  # 一度に出す最大の人数。近い順。0 なら上限なし
  max: 0
  # 目からこの距離（ブロック）より近いゴーストは隠す。
  # マネキンはクリックを受け止めるので、手の届くブロックの手前に来ないようにする
  hide-within: 5

# 時代（つながったコースのまとまり）
eras:
  # 時代の途中でログアウトした人が戻ったとき、全レーンが使用中なら待つ場所。
  # "ワールド名 x y z" または "ワールド名 x y z yaw pitch"。空ならロビーのスポーン
  waiting-spot: ""

# 自動生成の試作（/module generate <プロファイル> [シード]）。モジュールは /module で作る。下の値は /module place・set・profile でも変えられる
generator:
  # コースのスタート。"ワールド名 x y z"：スタートで立つブロック。コースは +Z に向かって伸びる。start-yaw はスタートでの向き（0 が +Z）
  place: ""
  start-yaw: 0
  # コースのスタートのブロックから、最初のモジュールのスタートのブロックまでのずれ（"x y z"、整数）
  start-offset: "0 0 0"
  # この難易度以上を「難しい」とし、続けて置くのは max-hard-streak 個まで
  hard-from: 4
  max-hard-streak: 2
  # つなぎ目：none（前のゴールの位置に次のスタート）/ platform（間に平らな足場）
  joint: none
  # platform のときの足場の長さ（ブロック）と、足場のブロック
  joint-length: 3
  joint-block: "minecraft:smooth_stone"
  # 生成したコースの制限時間＝各モジュールの「モジュール時間×(1＋バッファ/100)」の合計。バッファはモジュールごとに設定画面で決められ、
  # 決めていないモジュールはこの値を使う。生成した時点で決まり、あとで変えても作り直すまで変わらない
  buffer-percent: 10
  # 通しの記録がこの回数たまったモジュールは、モジュール時間が中央値に合わせて変わる（ロックしたものは変わらない）。計測用の生成もこの回数を目安にする
  auto-time-passes: 5
  # プロファイル。modules 何個つなぐか / distribution 難易度1〜5の割合（比。合計100でなくてよい）/
  # bumpiness でこぼこ（0 なら易しい順にきれいに並ぶ。大きいほど順番が入れ替わり、起伏が増える。1〜2くらいが目安）/
  # bands 難易度帯の決まり（任意）。"4-5:1-2" なら難易度4〜5を1個以上2個以下。ゲーム内の /module menu で編集できる
  profiles:
    test:
      modules: 5
      distribution: [3, 3, 2, 1, 1]
      bumpiness: 1

# リプレイ（本番のクリアだけ記録。運営が /replay で見る）
replays:
  # プレイヤー×コース×版ごとに、ベストのほかに残す直近のクリアの数
  recent: 3
  # 全部のリプレイの容量の上限（MB）。超えたら、誰のベストでもない古いものから消す
  max-mb: 1024
  # 再生中の操作アイテムを頭にするときの、頭のテクスチャの値（Minecraft-Heads などの「Value」）。空ならふつうのアイテム
  keys:
    back: ""
    pause: ""
    forward: ""
    speed: ""
    stop: ""
