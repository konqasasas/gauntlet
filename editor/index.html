<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dialog Custom GUI</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Dialog Custom GUI <span class="muted">MC 26.3 / Paper</span></div>
  <div class="tabs" id="screenTabs" role="tablist" aria-label="画面"></div>
  <div class="spacer"></div>
  <div class="seg" role="group" aria-label="表示モード">
    <button data-mode="edit" class="on" title="要素を配置・編集">編集</button>
    <button data-mode="game" title="ゲーム内の見た目の概算。クリックで遷移を試せます">プレビュー</button>
    <button data-mode="compiled" title="出力したフォント/Dialogをクライアント規則で再構成">検証</button>
  </div>
  <button id="undoBtn" title="元に戻す (Ctrl+Z)">↶</button>
  <button id="redoBtn" title="やり直す (Ctrl+Y)">↷</button>
  <button id="exportBtn" class="primary">書き出し</button>
  <span id="status" class="status" aria-live="polite"></span>
</header>

<main class="layout">
  <aside class="left">
    <section>
      <h2>画面 <button id="addScreen" class="mini" title="画面を追加">＋</button></h2>
      <ul id="screenList" class="list"></ul>
    </section>
    <section>
      <h2>追加</h2>
      <div class="addgrid">
        <button data-add="rect">矩形</button>
        <button data-add="text">テキスト</button>
        <button data-add="image">画像</button>
        <button data-add="button">ボタン</button>
        <button data-add="hotspot">クリック領域</button>
      </div>
    </section>
    <section class="grow">
      <h2>レイヤー <span class="muted small">上ほど前面</span></h2>
      <ul id="layerList" class="list layers"></ul>
    </section>
    <section>
      <h2>素材 <label class="mini filebtn" title="画像を追加">＋<input type="file" id="assetInput" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden></label></h2>
      <ul id="assetList" class="assets"></ul>
      <p class="muted small">画像をキャンバスへドロップしても追加できます。</p>
    </section>
  </aside>

  <section class="center">
    <div class="stagebar">
      <label>倍率 <select id="zoomSel"><option value="0" selected>自動</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label>
      <label><input type="checkbox" id="gridChk" checked> 9px行</label>
      <label><input type="checkbox" id="snapChk" checked> スナップ</label>
      <label><input type="checkbox" id="clickChk"> クリック領域</label>
      <span class="muted small" id="cursorPos"></span>
      <div class="spacer"></div>
      <span class="muted small" id="modeNote"></span>
    </div>
    <div class="stage" id="stage">
      <canvas id="canvas"></canvas>
      <div id="tooltip" class="mc-tooltip" hidden></div>
    </div>
    <div class="diag" id="diag" aria-live="polite"></div>
  </section>

  <aside class="right" id="inspector"></aside>
</main>

<dialog id="exportDlg">
  <form method="dialog">
    <h2>書き出し結果</h2>
    <div id="exportBody"></div>
    <menu><button value="close">閉じる</button></menu>
  </form>
</dialog>

<datalist id="fontList"></datalist>
<script type="module" src="/app.js"></script>
</body>
</html>
